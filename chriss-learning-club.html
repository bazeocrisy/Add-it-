var PASSAGES = [
  {
    id: 'p1', title: 'Teamwork on the Baseball Field', type: 'Nonfiction', topic: 'Baseball teamwork',
    paras: [
      ['Baseball might look like a contest between one pitcher and one batter, but it is really a team sport.', 'When a team is in the field, nine players work together to stop the other team from scoring runs.', 'Each player has a position, which is a special place and job on the field.', 'The pitcher throws the ball toward home plate, and the catcher crouches behind the plate to catch it.', 'Four infielders play near the bases, while three outfielders cover the wide grass farther away.'],
      ['Sometimes a batter hits the ball deep into the outfield.', 'The outfielder who chases it down may be too far away to throw it all the way to home plate.', 'Instead, the outfielder throws the ball to an infielder who is waiting in between.', 'That player catches it, turns, and quickly throws it the rest of the way.', 'Passing the ball this way is called a relay, and it is usually faster than one long throw that bounces across the grass.'],
      ['Good teammates also communicate, which means they share information by talking or giving signals.', 'When a high fly ball goes up between two players, one of them shouts, “I got it!”', 'The other player hears the call and moves out of the way.', 'Without that call, the two players might crash into each other and drop the ball.', 'Catchers communicate too, because they use hand signals to tell the pitcher which pitch to throw.'],
      ['No single player can win a baseball game alone.', 'When every player does a job, helps teammates, and speaks up, the whole team plays better.']
    ],
    qs: [
      { id: 'p1q1', sk: 'main', q: 'Which sentence BEST tells the main idea of this passage?', c: ['Baseball players do their own jobs and work together to help the team.', 'The pitcher is the most important player on a baseball team.', 'Outfielders play on the grass far away from home plate.', 'Players should shout as loudly as they can during a game.'], a: 0, h: 'Read the first sentence and the last paragraph. What idea do all the paragraphs support?', ex: 'The passage says baseball is really a team sport, and every paragraph shows players doing jobs, helping, and talking to each other. The last paragraph says it again.', why: [null, 'The passage says no single player can win alone. It never says the pitcher is most important.', 'This is true, but it is only one small detail from the first paragraph.', 'Players call “I got it!” to stay safe, but the passage never says to shout as loudly as you can.'] },
      { id: 'p1q2', sk: 'detail', q: 'According to the passage, why does a catcher use hand signals?', c: ['To tell the outfielders where to stand', 'To tell the pitcher which pitch to throw', 'To tell the batter when to swing', 'To tell the fans when to cheer'], a: 1, h: 'Find the word signals in the third paragraph and read that whole sentence.', ex: 'The passage says catchers “use hand signals to tell the pitcher which pitch to throw.”', why: ['The passage does not say the catcher tells outfielders where to stand.', null, 'The catcher is on the other team from the batter, so he would not help the batter.', 'Fans are not mentioned in the passage.'] },
      { id: 'p1q3', sk: 'vocab', q: 'What does the word relay mean in this passage?', c: ['A kind of baseball glove', 'A throw that goes from one player to a teammate and then on to the base', 'A high fly ball hit between two players', 'A signal that the catcher gives the pitcher'], a: 1, h: 'Read the sentences in the second paragraph that come BEFORE “Passing the ball this way is called a relay.”', ex: 'The outfielder throws to an infielder, who catches it and throws it the rest of the way. Passing the ball this way is a relay.', why: ['Gloves are never mentioned in the passage.', null, 'Fly balls are in the third paragraph, not the part about the relay.', 'Hand signals are a way to communicate, not a relay.'] },
      { id: 'p1q4', sk: 'evidence', k: 'ev', q: 'Tap the sentence that tells what could happen if two players did NOT call for the ball.', ok: [13], h: 'Look in the paragraph about how teammates communicate. Find the sentence that starts with “Without.”', ex: '“Without that call, the two players might crash into each other and drop the ball.” tells what could happen with no call.' },
      { id: 'p1q5', sk: 'sequence', q: 'In a relay, what happens right after the infielder catches the ball from the outfielder?', c: ['The batter hits the ball deep into the outfield.', 'The outfielder runs the ball to home plate.', 'The infielder turns and throws the ball the rest of the way.', 'The pitcher throws the next pitch.'], a: 2, h: 'Find the sentence that starts “That player catches it.” Read the rest of that sentence.', ex: 'The passage says: “That player catches it, turns, and quickly throws it the rest of the way.”', why: ['That happens BEFORE the relay starts.', 'The outfielder is too far away, so he throws instead of running.', null, 'The passage does not say what the pitcher does next.'] }
    ]
  },
  {
    id: 'p2', title: 'The Thankful Tree', type: 'Fiction', topic: 'A family Thanksgiving activity',
    paras: [
      ['Every Thanksgiving, the Carter family made a thankful tree before dinner.', 'First, Grandpa Leon stuck a tall, bare branch into a flowerpot and set it in the middle of the living room.', 'Then he handed everyone a stack of paper leaves cut from orange, red, and yellow construction paper.'],
      ['“Write one thing you are thankful for on each leaf,” Grandpa said.', 'Nia’s cousins started writing right away, but Nia hesitated, holding her marker above the paper without writing a single word.', 'She was thankful for lots of things, yet every idea seemed too small or too silly.', 'Soon the branch was covered with leaves from everyone except her, and her cheeks felt hot.'],
      ['Grandpa noticed and sat down beside her on the rug.', '“A thankful leaf doesn’t have to be fancy,” he said gently.', '“What made you smile this week?”', 'Nia thought for a moment, and then she remembered how her little brother, Jace, had shared his last cracker with her.', 'She also remembered the warm cinnamon rolls her aunt had baked that morning.'],
      ['Nia grabbed her marker and began to write.', 'Before long, she had filled five leaves, and she hung them carefully on the lowest branch.', 'At dinner, the family took turns reading the leaves out loud.', 'When Grandpa read Nia’s leaf about the cracker, Jace beamed, and Nia felt proud that she had shared her ideas.']
    ],
    qs: [
      { id: 'p2q1', sk: 'sequence', q: 'What did Grandpa Leon do FIRST to make the thankful tree?', c: ['He handed out paper leaves.', 'He stuck a bare branch into a flowerpot.', 'He read the leaves out loud at dinner.', 'He sat down beside Nia on the rug.'], a: 1, h: 'Look for the signal word First in the first paragraph.', ex: 'The story says: “First, Grandpa Leon stuck a tall, bare branch into a flowerpot.”', why: ['He did that NEXT. The sentence starts with Then.', null, 'That happened at the very end of the story.', 'That happened later, when Nia was stuck.'] },
      { id: 'p2q2', sk: 'vocab', q: 'What does hesitated mean in this story?', c: ['Wrote very quickly', 'Waited because she was unsure what to do', 'Laughed at a joke', 'Gave something away'], a: 1, h: 'Read the rest of that sentence and the sentence after it. Was Nia writing? Why not?', ex: 'Nia held her marker above the paper without writing, because every idea seemed too small. Hesitated means she waited because she was unsure.', why: ['Her cousins wrote right away. Nia did not write a single word.', null, 'Nobody tells a joke in this part of the story.', 'Jace gave away a cracker, but that is a different part of the story.'] },
      { id: 'p2q3', sk: 'inference', q: 'Why did Nia’s cheeks most likely feel hot?', c: ['She was sitting next to a warm oven.', 'She was embarrassed that she had not written anything yet.', 'She was angry at her cousins for writing so fast.', 'She had just run around the yard.'], a: 1, h: 'Clue: the branch was covered with leaves from everyone EXCEPT her. How do you feel when everyone else is done and you are not?', ex: 'Everyone else had leaves on the tree, and Nia had none. Many people feel embarrassed in that spot, and their cheeks can feel hot.', why: ['The story never says she was near an oven.', null, 'Nothing in the story shows she was angry at anyone.', 'Nia was inside the living room, not running in the yard.'] },
      { id: 'p2q4', sk: 'evidence', k: 'ev', q: 'Tap something Grandpa SAID that helped Nia think of an idea.', ok: [8, 9], h: 'Look in the paragraph where Grandpa sits down beside Nia. Find his words inside quotation marks.', ex: 'Grandpa said, “A thankful leaf doesn’t have to be fancy,” and asked, “What made you smile this week?” Those words helped Nia remember good things.' },
      { id: 'p2q5', sk: 'main', q: 'What is this story mostly about?', c: ['How to cut leaves out of construction paper', 'A family baking cinnamon rolls on Thanksgiving', 'A girl who gets help thinking of ideas for her family’s thankful tree', 'A boy who shares his last cracker'], a: 2, h: 'Think about Nia’s problem at the beginning and how it is solved at the end.', ex: 'Nia cannot think of what to write, Grandpa helps her, and she fills five leaves. That is what the whole story is about.', why: ['The leaves were already cut when the story began.', 'The cinnamon rolls are only one small detail.', null, 'Jace’s cracker is one idea Nia writes about, not the whole story.'] }
    ]
  },
  {
    id: 'p3', title: 'Learning to Ride', type: 'Fiction', topic: 'Helping a friend',
    paras: [
      ['All summer, Trey watched the kids on Maple Street zoom past his house on their bikes.', 'He had a shiny green bike of his own, but he had never learned to ride it.', 'Whenever his friends asked him to race, Trey made up an excuse and stayed on his front steps.'],
      ['One afternoon, his best friend Keisha rolled up and noticed his bike leaning against the garage.', '“Why don’t you ever ride it?” she asked.', 'Trey stared at his sneakers and mumbled, “I don’t know how, and I’m scared I’ll fall.”', 'Keisha didn’t laugh at him.', '“I fell a lot when I was learning,” she said.', '“I can help you practice in the empty lot behind the library.”'],
      ['For the next three days, the two friends met there after lunch.', 'Keisha held the back of the seat while Trey pedaled slowly across the smooth pavement.', 'Each time he wobbled, she reminded him to look straight ahead instead of down at his feet.', 'On the third day, Trey was pedaling so smoothly that he didn’t notice when Keisha let go.'],
      ['“You’re doing it by yourself!” Keisha shouted.', 'Trey was so surprised that he nearly tipped over, but he kept his balance and laughed.', 'That evening, he rode down Maple Street beside Keisha, and he felt confident instead of afraid.']
    ],
    qs: [
      { id: 'p3q1', sk: 'inference', q: 'How did Trey most likely feel when his friends asked him to race?', c: ['Excited because he knew he would win', 'Nervous because he could not ride a bike', 'Angry because his friends were mean', 'Bored because racing was too easy'], a: 1, h: 'Clues: what did Trey do when they asked? What did he later tell Keisha?', ex: 'Trey made up an excuse and stayed on his steps, and later he said he did not know how to ride and was scared of falling. Those clues show he felt nervous.', why: ['Trey had never learned to ride, so he could not win a race.', null, 'Nothing in the story shows his friends were mean.', 'Racing was not easy for Trey. He could not ride yet.'] },
      { id: 'p3q2', sk: 'evidence', k: 'ev', q: 'Tap a sentence that shows Trey was afraid to ride his bike.', ok: [2, 5, 15], h: 'Look at what Trey did when his friends asked him to race, and what he told Keisha.', ex: 'Good proof: he made up an excuse not to race, he said, “I’m scared I’ll fall,” and at the end he felt confident “instead of afraid.”' },
      { id: 'p3q3', sk: 'detail', q: 'Where did Keisha help Trey practice?', c: ['On Maple Street', 'In Trey’s garage', 'In the empty lot behind the library', 'On the school playground'], a: 2, h: 'Read what Keisha said at the end of the second paragraph.', ex: 'Keisha said, “I can help you practice in the empty lot behind the library.”', why: ['Trey rode on Maple Street at the END, after he learned.', 'His bike leaned against the garage, but they did not practice there.', null, 'A playground is never mentioned.'] },
      { id: 'p3q4', sk: 'sequence', q: 'What happened right after Keisha shouted, “You’re doing it by yourself!”?', c: ['Keisha let go of the seat.', 'Trey nearly tipped over, but he kept his balance.', 'Trey made up an excuse not to race.', 'Keisha noticed the bike by the garage.'], a: 1, h: 'Find what Keisha shouted. Then read the very next sentence.', ex: 'The next sentence says Trey was so surprised that he nearly tipped over, but he kept his balance and laughed.', why: ['She let go BEFORE she shouted. That is why she shouted.', null, 'That happened at the beginning of the story.', 'That happened at the beginning of the second paragraph.'] },
      { id: 'p3q5', sk: 'main', q: 'What lesson does this story show?', c: ['Green bikes are faster than other bikes.', 'You should never ask anyone for help.', 'A patient friend can help you face something scary.', 'Learning to ride a bike is easy for everyone.'], a: 2, h: 'How did Trey change from the beginning to the end? Who helped him change?', ex: 'Trey was scared at first, but Keisha practiced with him for three days. By the end he felt confident. A patient friend helped him face his fear.', why: ['The color of the bike does not matter in the story.', 'Getting help is what solved Trey’s problem.', null, 'Trey wobbled and needed three days of practice, so it was not easy.'] }
    ]
  },
  {
    id: 'p4', title: 'The Kite That Would Not Fly', type: 'Fiction', topic: 'Solving a small problem',
    paras: [
      ['On a windy Saturday in March, Aaliyah carried her new diamond kite to the park near her apartment.', 'She had saved her allowance for weeks to buy it, and she couldn’t wait to see it soar above the trees.', 'But every time she let out the string, the kite spun in circles and crashed into the grass.'],
      ['After the fifth crash, Aaliyah plopped down on a bench and crossed her arms.', '“This kite is broken,” she grumbled.', 'An older boy named Luis was flying a bright red kite nearby, and he walked over to take a look.', '“I don’t think it’s broken,” he said.', '“Its tail is just too short, so it can’t stay steady in the wind.”'],
      ['Aaliyah studied Luis’s kite and noticed that its tail was much longer than hers.', 'She searched her backpack until she found two long hair ribbons.', 'Carefully, she tied the ribbons to the end of the kite’s tail to make it longer.'],
      ['This time, when the wind tugged on the string, the kite climbed higher and higher without spinning.', 'Aaliyah laughed as it floated above the treetops like a bird.', '“Thanks, Luis!” she called across the field.', 'From then on, she always checked her kite’s tail before she let out the string.']
    ],
    qs: [
      { id: 'p4q1', sk: 'main', q: 'What problem did Aaliyah have?', c: ['She could not find the park.', 'Her kite kept spinning and crashing instead of flying.', 'Her kite string broke.', 'Luis took her kite away.'], a: 1, h: 'Read the last sentence of the first paragraph.', ex: 'Every time Aaliyah let out the string, her kite spun in circles and crashed into the grass.', why: ['She carried her kite to the park, so she found it.', null, 'The string never breaks in the story.', 'Luis helped her. He did not take her kite.'] },
      { id: 'p4q2', sk: 'sequence', q: 'What did Aaliyah do right after Luis said the tail was too short?', c: ['She sat on a bench and crossed her arms.', 'She tied two ribbons to the tail.', 'She studied Luis’s kite and saw its long tail.', 'She saved her allowance to buy the kite.'], a: 2, h: 'Find what Luis said about the tail. Then read the first sentence of the next paragraph.', ex: 'Right after Luis spoke, Aaliyah studied his kite and noticed its tail was much longer than hers.', why: ['She sat on the bench BEFORE Luis came over.', 'She tied the ribbons a little later, after she found them in her backpack.', null, 'That happened weeks before the story.'] },
      { id: 'p4q3', sk: 'vocab', q: 'What does soar mean in this story?', c: ['To fly high in the air', 'To fall to the ground', 'To spin in circles', 'To be sold in a store'], a: 0, h: 'Read “soar above the trees.” Then look at what the kite does in the last paragraph once it works.', ex: 'Aaliyah wanted to see her kite soar above the trees. At the end it climbs higher and higher and floats above the treetops, so soar means to fly high in the air.', why: [null, 'That is what happened when the kite crashed, which is the opposite of what she wanted.', 'Spinning in circles was the problem, not what she hoped to see.', 'The word is about how the kite moves, not about buying it.'] },
      { id: 'p4q4', sk: 'evidence', k: 'ev', q: 'Tap a sentence that proves Aaliyah’s idea worked.', ok: [11, 12], h: 'Look in the last paragraph. What did the kite do after she made the tail longer?', ex: 'The kite “climbed higher and higher without spinning” and “floated above the treetops.” Both show the longer tail worked.' },
      { id: 'p4q5', sk: 'inference', q: 'Why did Aaliyah start checking her kite’s tail before flying it?', c: ['So her kite would not spin and crash again', 'Because Luis told her to check it every day', 'Because she wanted to trade ribbons', 'So the kite would fly lower'], a: 0, h: 'Think about the problem she just solved. What would keep it from happening again?', ex: 'A short tail made her kite crash. Checking the tail first helps make sure it stays steady and does not crash again.', why: [null, 'Luis only explained the problem. He never told her to check it every day.', 'Trading ribbons is never mentioned.', 'She wanted her kite to fly high, not low.'] }
    ]
  },
  {
    id: 'p5', title: 'How Squirrels Prepare for Winter', type: 'Nonfiction', topic: 'Animals and nature',
    paras: [
      ['In autumn, you might see a gray squirrel dashing across a yard with an acorn in its mouth.', 'The squirrel is not playing a game.', 'Gray squirrels do not sleep through the winter, so they must get ready for the cold months while food is still easy to find.'],
      ['Instead of keeping all their food in one place, gray squirrels bury nuts one at a time in many different spots.', 'A squirrel digs a small hole, drops in a nut, and pats the soil down with its front paws.', 'Storing food this way is called scatter hoarding.', 'One busy squirrel can bury thousands of nuts in a single fall!'],
      ['Later, when the ground is covered with leaves or snow, the squirrel must find its hidden meals.', 'Gray squirrels remember the general area of many of their hiding spots.', 'Then they use their strong sense of smell to sniff out the exact place.', 'Still, squirrels do not dig up every nut they bury.', 'Some of the forgotten acorns sprout in the spring and slowly grow into new oak trees.'],
      ['Squirrels also build round nests called dreys high in the branches.', 'They weave twigs together and line the inside with soft leaves and moss.', 'On freezing nights, a squirrel may curl up in its drey and wrap its fluffy tail around its body like a blanket.']
    ],
    qs: [
      { id: 'p5q1', sk: 'main', q: 'What is the main idea of this passage?', c: ['Gray squirrels store food and build nests to get through the winter.', 'Oak trees grow from acorns.', 'Squirrels have fluffy tails.', 'Squirrels like to play games in the yard.'], a: 0, h: 'Look at the title and the last sentence of the first paragraph. What do the other paragraphs explain?', ex: 'The passage explains how gray squirrels hide food, find it later, and build nests so they can make it through the cold winter.', why: [null, 'This is one detail in the third paragraph, not the main idea.', 'This is a small detail from the last paragraph.', 'The passage says the squirrel is NOT playing a game.'] },
      { id: 'p5q2', sk: 'vocab', q: 'What does the word sprout mean in this passage?', c: ['To rot and turn brown', 'To begin to grow', 'To be buried in a hole', 'To be eaten by a squirrel'], a: 1, h: 'Read the whole sentence: the acorns sprout in the spring and then grow into oak trees.', ex: 'The forgotten acorns sprout and slowly grow into new oak trees. Sprout means to begin to grow.', why: ['Something that rots could not grow into a tree.', null, 'The acorns were already buried before they sprouted.', 'These acorns were forgotten, so they were NOT eaten.'] },
      { id: 'p5q3', sk: 'detail', q: 'How does a gray squirrel find the exact spot where it buried a nut?', c: ['It follows a trail of leaves.', 'It watches where other animals dig.', 'It sniffs it out with its strong sense of smell.', 'It remembers the exact spot of every single nut.'], a: 2, h: 'Read the third paragraph carefully. Find the word exact.', ex: 'The passage says squirrels remember the general area, and then “they use their strong sense of smell to sniff out the exact place.”', why: ['The passage never mentions a trail of leaves.', 'The passage does not say squirrels watch other animals.', null, 'Squirrels remember the general AREA, and they do not find every nut.'] },
      { id: 'p5q4', sk: 'evidence', k: 'ev', q: 'Tap the sentence that shows squirrels can help new trees grow.', ok: [11], h: 'Look in the third paragraph for the word trees.', ex: '“Some of the forgotten acorns sprout in the spring and slowly grow into new oak trees.” shows that the nuts squirrels bury can become trees.' },
      { id: 'p5q5', sk: 'inference', q: 'Why do gray squirrels bury food in the fall instead of waiting until winter?', c: ['In winter, food is harder to find, so they need a supply saved up.', 'They want to plant a garden of oak trees.', 'The ground is too soft to dig in winter.', 'Other squirrels make them do it.'], a: 0, h: 'Clue: the first paragraph says they get ready “while food is still easy to find.” What do you know about food and plants in winter?', ex: 'The passage says squirrels get ready while food is still easy to find. In winter, few plants grow and snow covers the ground, so saved food helps them eat.', why: [null, 'The trees grow from nuts they FORGET. They do not plan a garden.', 'In winter the ground is often frozen and hard, not soft.', 'The passage does not say other squirrels make them.'] }
    ]
  },
  {
    id: 'p6', title: 'Caps On', type: 'Fiction', topic: 'Learning from a mistake',
    paras: [
      ['Jalen’s older sister, Simone, owned a set of fifty markers that she used for her art club projects.', 'One rainy afternoon, Jalen wanted to color a poster of a giant dragon, so he borrowed the markers while Simone was at soccer practice.', 'He didn’t ask first, because he planned to put them back before she got home.'],
      ['Jalen colored for an hour, and then he rushed outside when the rain stopped.', 'He left the markers scattered across the kitchen table, and most of the caps were still off.', 'That evening, Simone found them lying there.', 'When she tried to draw with her favorite purple marker, it made only a faint, scratchy line because it was drying out.', '“Jalen!” she called from the kitchen.', '“Who left my markers open?”'],
      ['Jalen’s stomach sank when he saw the pile of uncapped markers.', 'He knew he should have asked, and he should have put the caps back on.', '“I’m sorry, Simone,” he said quietly.', '“I used your markers without asking, and I didn’t take care of them.”'],
      ['That weekend, Jalen used his own allowance to buy Simone a new purple marker.', 'He also promised to ask before borrowing anything and to snap every cap on tightly.', 'Two weeks later, Jalen asked to borrow the markers, and Simone said yes because she trusted him to be careful.']
    ],
    qs: [
      { id: 'p6q1', sk: 'sequence', q: 'Which of these happened FIRST?', c: ['Simone found the markers on the table.', 'Jalen borrowed the markers without asking.', 'Jalen bought a new purple marker.', 'Jalen told Simone he was sorry.'], a: 1, h: 'Look at the first paragraph. What did Jalen do on the rainy afternoon?', ex: 'On the rainy afternoon, Jalen borrowed the markers without asking. Everything else happened later.', why: ['Simone found the markers that evening, after Jalen went outside.', null, 'He bought the marker that weekend, near the end.', 'He said sorry after Simone found the markers.'] },
      { id: 'p6q2', sk: 'inference', q: 'How did Jalen most likely feel when he saw the pile of uncapped markers?', c: ['Proud of his dragon poster', 'Guilty because he knew he made a mistake', 'Excited to color some more', 'Sleepy after playing outside'], a: 1, h: 'Clues: his “stomach sank,” and he knew what he should have done. How do you feel when you know you did something wrong?', ex: 'His stomach sank, and he knew he should have asked and put the caps on. Those clues show he felt guilty.', why: ['He may have liked his poster, but in this moment his stomach sank.', null, 'The markers were drying out, and he was upset, not excited.', 'Nothing in the story says he was sleepy.'] },
      { id: 'p6q3', sk: 'vocab', q: 'What does faint mean in this story?', c: ['Bright and bold', 'Light and hard to see', 'Wet and sticky', 'Long and straight'], a: 1, h: 'Read the whole sentence. The marker was drying out. What kind of line does a dry marker make?', ex: 'A drying marker has little ink left, so its line is light and hard to see. That is what faint means.', why: ['A marker that is drying out cannot make a bright, bold line.', null, 'The marker was drying out, so its line was not wet.', 'The story tells about how the line looked, not how long it was.'] },
      { id: 'p6q4', sk: 'evidence', k: 'ev', q: 'Tap a sentence that shows something Jalen did to make up for his mistake.', ok: [11, 12, 13, 14, 15], h: 'Look at what Jalen said to Simone and what he did after that.', ex: 'Jalen said he was sorry and admitted what he did wrong, bought Simone a new purple marker, promised to ask first and put the caps on, and later asked before borrowing.' },
      { id: 'p6q5', sk: 'main', q: 'What lesson did Jalen learn?', c: ['Purple is the best marker color.', 'Ask before you borrow, and take good care of other people’s things.', 'It is better to color outside than inside.', 'Markers last forever if you use them a lot.'], a: 1, h: 'What did Jalen do wrong, and what did he promise at the end?', ex: 'Jalen borrowed without asking and left the caps off. He promised to ask first and snap every cap on, and Simone learned to trust him again.', why: ['The color of the marker is not the lesson.', null, 'The story is not about where to color.', 'The markers dried out quickly when the caps were off.'] }
    ]
  }
];

/* Step types: explain, show, compare, words, table, cards, guided, try, mc, reading */
var LESSONS = {
  verbs: [
    { id: 'A', title: 'Action Verbs', skill: 'action', key: 'A verb can tell what someone or something does.', steps: [
      { t: 'explain', title: 'Action verbs', text: ['A verb can tell what someone or something does.', 'Some actions you can see, like run and throw.', 'Some actions happen in your head, like think and learn.'] },
      { t: 'show', title: 'Watch me find it', mode: 'verb', s: 'Chris [swings] the bat.', labels: { swings: 'verb' }, text: ['Swings tells what Chris does.', 'We draw TWO lines under a verb.'] },
      { t: 'words', title: 'Action words to know', groups: [ { name: 'Body actions', words: ['run', 'jump', 'throw', 'catch', 'swing'] }, { name: 'Word actions', words: ['read', 'write', 'talk'] }, { name: 'Thinking actions', words: ['think', 'know', 'learn'] } ], text: ['Act out one body action.', 'Thinking actions happen in your brain. They are verbs too!'] },
      { t: 'guided', coach: 'What does the dog do? Tap that word.', q: { mode: 'verb', s: 'The dog [runs] outside.', ask: 'What does the dog do?', h: 'The dog is doing something. Which word tells what it does?', ex: 'Runs tells what the dog does. Runs is the verb.', notes: { outside: 'Outside tells WHERE the dog runs. It is not a verb.', dog: 'Dog names an animal. Which word tells what it DOES?' } } },
      { t: 'try', q: { mode: 'verb', s: 'Mom [cooks] dinner.', ask: 'What does Mom do?', h: 'Dinner is the food. Which word is the action?', ex: 'Cooks tells what Mom does.', notes: { dinner: 'Dinner is a thing (a noun). What does Mom DO?' } } },
      { t: 'try', q: { mode: 'verb', s: 'I [think] about baseball.', ask: 'What do I do?', h: 'This action happens in your head.', ex: 'Think is a thinking action. It is a verb.', notes: { baseball: 'Baseball is a thing (a game). Find the action.' } } }
    ] },
    { id: 'B', title: 'Being Verbs', skill: 'being', key: 'Some verbs tell about being: am, is, are, was, were.', steps: [
      { t: 'explain', title: 'Being verbs', text: ['Some verbs tell about being.', 'They do not show an action you can watch.', 'Being verbs include am, is, are, was, and were.'] },
      { t: 'show', title: 'Watch me find it', mode: 'verb', s: 'He [is] happy.', labels: { is: 'being verb', happy: 'describes him' }, text: ['Is tells about being.', 'Happy describes him. Happy is not a verb.'] },
      { t: 'compare', title: 'Is can work two ways', items: [ { mode: 'verb', s: 'He [is] happy.', line: 'Is stands alone. The verb is: is' }, { mode: 'verb', s: 'He [is] [running].', line: 'Is helps running. The verb is: is running' } ], text: ['Is can stand alone, or it can help another verb.'] },
      { t: 'guided', coach: 'Which word tells about being? Tap it.', q: { mode: 'verb', s: 'I [am] ready.', h: 'Look for a BE word: am, is, are, was, were.', ex: 'Am is the being verb. Ready describes me.', notes: { ready: 'Ready describes me. It is not a verb.' } } },
      { t: 'try', q: { mode: 'verb', s: 'The ball [was] in the grass.', h: 'Look for a BE word.', ex: 'Was is the being verb. It is the only verb in the sentence.', notes: { grass: 'Grass is a thing.' } } },
      { t: 'try', q: { mode: 'verb', s: 'She [is] [running].', ask: 'What is she doing?', h: 'Here is helps another verb. Find both words.', ex: 'Is helps running. The verb is: is running.' } }
    ] },
    { id: 'C', title: 'Memorize the Helpers', skill: 'helpers', key: 'There are 23 helping verbs in four families.', steps: [
      { t: 'explain', title: 'Helping verbs', text: ['Some short verbs can help another verb.', 'There are 23 of them, in four families.', 'Learn one family at a time. You do not need them all today!'] },
      { t: 'cards' },
      { t: 'mc', q: { q: 'BE family: am, is, are, ___, were', c: ['has', 'was', 'can'], a: 1, h: 'Say the chant: am, is, are, ...', ex: 'am, is, are, WAS, were.' } },

      ['A single honeybee hive can be home to thousands of bees, and almost every one of them has a job.', 'Most of the bees are female worker bees.', 'Some workers clean the hive, some feed the young bees, and others guard the entrance.', 'The oldest workers become foragers, which are bees that fly out to search for food.'],

  function qWidget(QS, opts) {

      main += '<p class="prompt">' + esc(prompt) + '</p>';
      var marks = QS.fb && QS.fb.marks && !test ? QS.fb.marks : null;
      main += sentenceHTML(q, { interactive: !QS.done, sel: QS.sel, marks: marks, links: QS.done && !test, nounIdx: QS.phase === 'adj' ? QS.nounIdx : null });

      });

    } else if (q.kind === 'sort') {
      main += '<p class="prompt big">' + esc(q.q) + '</p><div class="sort">';
      q.items.forEach(function (it, i) {
        var mk = QS.fb && QS.fb.marks && !test ? QS.fb.marks[i] : null;
        main += '<div class="sort-row' + (mk ? ' m-' + mk : '') + '"><span class="sort-word">' + esc(it[0]) + (mk === 'ok' ? ' ✓' : mk === 'no' ? ' ✕' : '') + '</span>';

        main += '<span class="sort-btns" role="group" aria-label="Group for ' + esc(it[0]) + '">';

        });

    }

  function promptFor(q) {
    if (q.mode === 'verb') return 'Tap EVERY verb word: main verbs and their helpers.';
    if (q.mode === 'noun') {
      if (!q.want) return 'Tap ALL the nouns.';
      return { p: 'Tap the noun that names a PERSON.', l: 'Tap the noun that names a PLACE.', t: 'Tap the noun that names a THING.', i: 'Tap the noun that names an IDEA.', P: 'Tap every PROPER noun (special names).', c: 'Tap every COMMON noun.' }[q.want];
    }
    if (q.mode === 'adj') return 'Tap every adjective (describing word).';
    if (q.mode === 'adv') return q.want ? 'Tap the adverb that tells ' + q.want.toUpperCase() + '.' : 'Tap the adverb.';
    return '';
  }

  /* Actions on the active question */
  function activeQS() { return view.qs || null; }
  function qAct(act, el) {
    var QS = activeQS(); if (!QS) return;
    var q = QS.q, i = el ? parseInt(el.getAttribute('data-i'), 10) : -1;
    if (act === 'tok' && !QS.done) {
      var k = QS.sel.indexOf(i); if (k >= 0) QS.sel.splice(k, 1); else QS.sel.push(i);
      QS.fb = null;
    } else if (act === 'choice' && !QS.done) { QS.choice = i; QS.fb = null; }
    else if (act === 'sort' && !QS.done) { QS.sort[i] = parseInt(el.getAttribute('data-b'), 10); QS.fb = null; }
    else if (act === 'ev' && !QS.done) { QS.pick = i; QS.fb = null; }
    else if (act === 'hint' && !QS.done) { QS.hint = Math.min(2, QS.hint + 1); }
    else if (act === 'check' && !QS.done) {
      if (QS.ctx === 'test') return;
      var r = evaluate(QS);
      if (r.empty) { QS.fb = r; render(); return; }
      QS.tries++; QS.fb = r;
      if (r.correct) {
        if (QS.phase === 'noun') {
          QS.nounIdx = uniqueTargets(q)[0]; QS.phase = 'adj'; QS.sel = [];
          QS.fb = { msgs: [{ t: 'good', x: 'Yes! “' + q.toks[QS.nounIdx].w + '” is the noun. Now find the word that describes it.' }], marks: {} };
        } else {
          QS.done = true; flash = praise(); questionDone(QS);
        }
      }
    } else if (act === 'showme' && !QS.done) {
      QS.revealed = true; QS.done = true; QS.phase = null; QS.nounIdx = null;
      var marks = {};
      if (q.kind === 'select') { QS.sel = q.ans.slice(); q.ans.forEach(function (j) { marks[j] = 'reveal'; }); }
      if (q.kind === 'mc') { QS.choice = q.a; marks[q.a] = 'ok'; }
      if (q.kind === 'sort') { q.items.forEach(function (it, j) { QS.sort[j] = it[1]; marks[j] = 'ok'; }); }
      if (q.kind === 'ev') { QS.pick = q.ok[0]; marks[q.ok[0]] = 'ok'; }
      QS.fb = { msgs: [{ t: 'info', x: 'Here is the answer. ' + q.ex }], marks: marks };
      questionDone(QS);
    }
    if (view.v === 'test') { view.ans[q.id] = saveAnswer(QS); saveResume(); }
    if (view.v === 'mastery' && P.mastery) { P.mastery.ans[q.id] = saveAnswer(QS); saveP(); }
    render();
  }

    if (view.v === 'round') {
      var oc = outcomeOf(QS);
      record(QS.q, oc);
      view.res[view.i] = oc;
      saveResume();
    }
  }

  function verbDiagnosis(q, sel) {

    q.teams.forEach(function (t) {
      var main = t[t.length - 1], helpers = t.slice(0, -1);
      var mh = helpers.filter(function (i) { return sel.indexOf(i) < 0; }).map(function (i) { return q.toks[i].w; });
      if (sel.indexOf(main) < 0) notes.push('Missed the main verb “' + q.toks[main].w + '”.');
      if (mh.length) notes.push('Missed the helper' + (mh.length > 1 ? 's' : '') + ' “' + mh.join('”, “') + '”.');
    });
    if (extra.length) notes.push('Extra word' + (extra.length > 1 ? 's' : '') + ' that ' + (extra.length > 1 ? 'are' : 'is') + ' not a verb here: “' + extra.join('”, “') + '”.');
    return notes;
  }

      case 'startRound': return startRound(view.a, view.mode, A('sk') || null, null);
      case 'startStory': return startRound('reading', view.mode, null, A('p'));
      case 'practiceSkill': return startRound(A('a'), A('mode') || 'practice', A('sk'), null);
      case 'testSetup': return go({ v: 'testSetup', a: view.a });
      case 'startTest': return startTest(view.a, parseInt(A('n'), 10));
      case 'guides': return go({ v: 'guides' });
      case 'grown': return go({ v: 'grown' });
      case 'sheet': return go({ v: 'sheet', k: A('k') });
      case 'print': return window.print();
      case 'pdfDownload': {
        try { var url = getPdfURL(), link = D.createElement('a'); link.href = url; link.download = 'Chris_II_Verb_Memory_Guide.pdf'; D.body.appendChild(link); link.click(); link.remove(); } catch (err) { alert('Sorry, the PDF could not be downloaded in this browser.'); }
        return;
      }
      case 'pdfOpen': { try { window.open(getPdfURL(), '_blank'); } catch (err2) { /* ignore */ } return; }
      case 'askReset': view.confirmReset = true; return render();
      case 'cancelReset': view.confirmReset = false; return render(true);
      case 'doReset': {
        P = defP(); saveP(); view.confirmReset = false; render(true); return;
      }
      // lessons
      case 'lnext': {
        var les = lessonById(view.a, view.l);
        if (view.step >= les.steps.length - 1) { P.lessons[view.a + ':' + view.l] = true; saveP(); return go({ v: 'lessonEnd', a: view.a, l: view.l }); }
        view.step++; setLessonQS(view); saveResume(); return render(true);
      }
      case 'lback': {
        if (view.step === 0) return go({ v: 'learn', a: view.a });
        view.step--; setLessonQS(view); saveResume(); return render(true);
      }
      case 'lrepeat': view.step = 0; view.cards = { f: 0, covered: false, revealed: false }; setLessonQS(view); saveResume(); return render(true);
      case 'fam': view.cards = { f: parseInt(A('i'), 10), covered: false, revealed: false }; return render();
      case 'cover': view.cards.covered = true; view.cards.revealed = false; render(); var rv = app.querySelector('[data-fkey="reveal"]'); if (rv) rv.focus(); return;
      case 'reveal': view.cards.covered = false; view.cards.revealed = true; render(); var cv = app.querySelector('[data-fkey="cover"]'); if (cv) cv.focus(); return;
      // practice rounds
      case 'nextQ': {
        if (view.i >= view.ids.length - 1) return go({ v: 'roundEnd', a: view.a, mode: view.mode, sk: view.sk, story: view.story, ids: view.ids, res: view.res });
        view.i++; view.qs = newQS(QBY[view.ids[view.i]], view.mode); flash = null; saveResume(); return render(true);
      }
      case 'quitRound': P.resume = null; saveP(); return go({ v: 'area', a: view.a });
      case 'again': {
        if (view.story) { var nx = storyOrder()[0]; return startRound('reading', view.mode, null, nx.id); }
        return startRound(view.a, view.mode, view.sk, null);
      }
      // tests
      case 'tnext': case 'tprev': case 'tjump': {
        view.ans[view.qs.q.id] = saveAnswer(view.qs);
        view.i = act === 'tnext' ? view.i + 1 : act === 'tprev' ? view.i - 1 : parseInt(A('i'), 10);
        view.v = 'test'; view.qs = newQS(QBY[view.ids[view.i]], 'test', view.ans[view.ids[view.i]]); saveResume(); return render(true);
      }
      case 'treview': view.ans[view.qs.q.id] = saveAnswer(view.qs); view.v = 'testReview'; saveResume(); return render(true);
      case 'tback': view.v = 'test'; view.qs = newQS(QBY[view.ids[view.i]], 'test', view.ans[view.ids[view.i]]); return render(true);
      case 'submitTest': return submitTest();
      case 'masteryIntro': return go({ v: 'masteryIntro' });
      case 'mStart': return startMastery(false);
      case 'mRestartAsk': view.confirmRestart = true; return render();
      case 'mRestartNo': view.confirmRestart = false; return render(true);
      case 'mRestart': return startMastery(true);
      case 'mPrev': case 'mNext': case 'mJump': {
        if (view.v === 'mastery') P.mastery.ans[view.qs.q.id] = saveAnswer(view.qs);
        var cur = P.mastery.i;
        if (act === 'mNext' && (cur + 1) % 10 === 0 && cur + 1 < MASTERY_IDS.length) { P.mastery.i = cur + 1; saveP(); return go({ v: 'masteryBreak', done: cur + 1 }); }
        return openMasteryQ(act === 'mNext' ? cur + 1 : act === 'mPrev' ? cur - 1 : parseInt(A('i'), 10));
      }
      case 'mResume': return openMasteryQ(P.mastery.i);
      case 'mPause': if (view.v === 'mastery') P.mastery.ans[view.qs.q.id] = saveAnswer(view.qs); saveP(); return go({ v: 'home' });
      case 'mReview': P.mastery.ans[view.qs.q.id] = saveAnswer(view.qs); saveP(); return go({ v: 'masteryReview' });
      case 'mSubmit': return submitMastery();
      case 'quitTest': P.resume = null; saveP(); return go({ v: 'area', a: view.a });
      // question actions
      case 'tok': case 'choice': case 'sort': case 'ev': case 'hint': case 'check': case 'showme':
        return qAct(act, el);
    }
  });

  /* Test hooks for automated checks (harmless in normal use) */
  window.__CLC = { QBY: QBY, AREA_Q: AREA_Q, gradeOnly: gradeOnly, evaluate: function (q, sel) { return evaluate({ q: q, sel: sel, phase: null }); }, lessonQ: lessonQ, P: function () { return P; }, view: function () { return view; }, CHECK_Q: CHECK_Q, MASTERY_Q: MASTERY_Q, masteryMeets: masteryMeets };

  render(true);
})();
