<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chris's Learning Club</title>
<meta name="description" content="Short, guided grammar, phonics, and reading lessons for a third grader. Works offline.">
<style>
:root {
  --navy: #13294b; --navy2: #1f3d6e; --teal: #0e7c7b; --teal-l: #d9f2ef; --gold: #f4b41a; --gold-d: #b07c00; --gold-l: #fff1c9;
  --cream: #fffaf0; --white: #ffffff; --ink: #1a2233; --muted: #4b5568; --line: #d9d2c3;
  --good: #1d7a35; --good-l: #e3f5e7; --fix: #a3470f; --fix-l: #fff0e2; --info-l: #eef3fb;
  --radius: 16px; --shadow: 0 2px 0 rgba(19, 41, 75, .12), 0 6px 18px rgba(19, 41, 75, .08);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--cream); color: var(--ink); font-family: Verdana, "Trebuchet MS", "Segoe UI", Tahoma, system-ui, sans-serif; font-size: 19px; line-height: 1.5; }
button { font: inherit; color: inherit; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 4px solid var(--gold); outline-offset: 3px; border-radius: 8px; }
h1:focus, h1:focus-visible { outline: none; }
.top { background: var(--navy); color: #fff; }
.top-in { max-width: 1040px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; color: #fff; cursor: pointer; padding: 4px; font-weight: 700; font-size: 20px; text-align: left; }
.brand svg { width: 38px; height: 38px; flex: none; }
.brand small { display: block; font-weight: 400; font-size: 13px; color: var(--gold-l); }
.top .spacer { flex: 1; }
.top-btn { background: var(--navy2); border: 2px solid rgba(255,255,255,.25); color: #fff; border-radius: 12px; min-height: 44px; padding: 6px 14px; cursor: pointer; font-size: 16px; }
.notice { max-width: 1040px; margin: 10px auto 0; padding: 10px 16px; background: var(--gold-l); border: 2px solid var(--gold); border-radius: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 16px; }
.notice[hidden] { display: none; }
main { max-width: 1040px; margin: 0 auto; padding: 16px 16px 60px; }
h1 { font-size: clamp(26px, 5vw, 36px); line-height: 1.2; margin: 6px 0 12px; color: var(--navy); }
h2 { font-size: 22px; color: var(--navy); margin: 0 0 8px; }
h3 { font-size: 19px; color: var(--navy); margin: 0 0 6px; }
.lead { font-size: 20px; }
.muted { color: var(--muted); }
.small { font-size: 15px; }
.section-h { margin: 26px 0 12px; }
.card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; margin: 14px 0; border: 2px solid #efe7d6; }
.center { text-align: center; }
.tag { display: inline-block; font-size: 13px; background: var(--gold-l); color: var(--navy); border: 1px solid var(--gold); border-radius: 999px; padding: 1px 9px; vertical-align: middle; font-weight: 700; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; padding: 10px 20px; border-radius: 14px; border: 3px solid var(--navy); background: var(--white); color: var(--navy); font-weight: 700; cursor: pointer; font-size: 18px; text-align: center; }
.btn:hover { background: #f3f6fb; }
.btn.primary { background: var(--teal); border-color: var(--teal); color: #fff; }
.btn.primary:hover { background: #0b6867; }
.btn.primary[aria-disabled="true"] { background: #9fb9b8; border-color: #9fb9b8; }
.btn.ghost { border-color: var(--line); color: var(--navy); }
.btn.big { min-height: 60px; font-size: 19px; }
.btn.small { min-height: 44px; padding: 6px 14px; font-size: 16px; }
.btn.danger { background: #9b1c1c; border-color: #9b1c1c; color: #fff; }
.subnav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.subnav .btn { min-height: 46px; padding: 6px 14px; font-size: 16px; border-width: 2px; }
.crumb { color: var(--muted); font-size: 16px; margin: 6px 0; }
.say { background: var(--teal-l); border: 2px solid var(--teal); color: var(--navy); border-radius: 999px; min-height: 44px; padding: 6px 14px; cursor: pointer; font-size: 16px; margin: 6px 0; }
.say.mini { padding: 4px 10px; margin: 0 6px; }

/* home */
.hero { display: flex; align-items: center; gap: 20px; background: var(--white); border-radius: 22px; box-shadow: var(--shadow); padding: 18px; border: 2px solid #efe7d6; }
.hero-art .kid, .end-art .kid { width: 150px; height: 150px; display: block; }
.hero-text { flex: 1; min-width: 0; }
.name-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.name-form label { width: 100%; font-weight: 700; }
.name-form input { font: inherit; min-height: 52px; padding: 8px 12px; border: 3px solid var(--navy); border-radius: 12px; width: 220px; max-width: 100%; }
.continue { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-color: var(--gold); background: var(--gold-l); }
.continue p { margin: 0; }
.area-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.area-card { display: grid; grid-template-columns: 64px 1fr; grid-template-rows: auto auto auto; column-gap: 14px; text-align: left; background: var(--white); border: 3px solid #e6dcc7; border-radius: 20px; padding: 16px; cursor: pointer; box-shadow: var(--shadow); min-height: 120px; }
.area-card:hover { border-color: var(--teal); }
.area-icon { grid-row: 1 / 4; width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; background: var(--cream); border-radius: 16px; }
.area-icon svg { width: 52px; height: 52px; }
.area-icon.lg { width: 72px; height: 72px; }
.area-name { font-weight: 700; font-size: 21px; color: var(--navy); }
.area-blurb { font-size: 16px; color: var(--muted); }
.area-prog { font-size: 15px; color: var(--teal); font-weight: 700; margin-top: 4px; }
.home-links { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.area-head { display: flex; align-items: center; gap: 14px; }

/* learning path */
.path { display: grid; gap: 12px; margin-top: 10px; }
.path-step { display: flex; align-items: center; gap: 16px; text-align: left; background: var(--white); border: 3px solid var(--navy); border-radius: 18px; padding: 14px 18px; cursor: pointer; min-height: 76px; box-shadow: var(--shadow); }
.path-step:hover { background: #f3f6fb; }
.path-step .num { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--gold); color: var(--navy); font-weight: 700; font-size: 22px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--navy); }
.path-step b { display: block; font-size: 20px; color: var(--navy); letter-spacing: .5px; }
.path-step span span { display: block; font-size: 16px; color: var(--muted); }
.lesson-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.lesson-item { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--white); border: 3px solid #e6dcc7; border-radius: 16px; padding: 12px 16px; cursor: pointer; min-height: 64px; }
.lesson-item:hover { border-color: var(--teal); }
.lesson-item.done { border-color: #a9d8b5; background: #f6fcf7; }
.l-id { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--navy); color: #fff; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.l-title { flex: 1; font-weight: 700; color: var(--navy); }
.l-state { font-size: 15px; color: var(--teal); font-weight: 700; }
.pick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.pick { text-align: left; background: var(--white); border: 3px solid #e6dcc7; border-radius: 16px; padding: 14px 16px; cursor: pointer; min-height: 72px; }
.pick:hover { border-color: var(--teal); }
.pick b { display: block; color: var(--navy); font-size: 19px; }
.pick span { display: block; font-size: 15px; color: var(--muted); }
.pick.main { border-color: var(--teal); background: var(--teal-l); }

/* lesson */
.steps-bar, .round-dots { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: #e6dcc7; border: 2px solid #cbbfa8; }
.dot.past { background: var(--teal); border-color: var(--teal); }
.dot.now { background: var(--gold); border-color: var(--navy); width: 18px; height: 18px; }
.steps-text { font-size: 15px; color: var(--muted); margin-left: 6px; }
.lesson-card h1 { font-size: clamp(24px, 4.5vw, 32px); }
.explain p { font-size: clamp(21px, 3.6vw, 26px); margin: 0 0 10px; }
.worked { background: var(--cream); border-radius: 14px; padding: 12px 14px; margin: 8px 0 14px; border: 2px dashed var(--gold); }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.cmp { background: var(--cream); border-radius: 14px; padding: 12px; border: 2px solid #efe7d6; }
.cmp p { margin: 6px 0 0; font-size: 18px; }
.word-group { margin-bottom: 12px; }
.chips, .tiles { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-block; background: var(--teal-l); border: 2px solid var(--teal); border-radius: 999px; padding: 6px 16px; font-size: 21px; font-weight: 700; color: var(--navy); min-height: 44px; cursor: default; }
button.chip { cursor: pointer; }
.tile { width: 72px; height: 72px; border-radius: 16px; background: var(--gold); color: var(--navy); font-size: 40px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; border: 3px solid var(--navy); margin-bottom: 12px; }
button.tile { cursor: pointer; }
.tbl { border-collapse: collapse; margin: 8px 0; font-size: 21px; }
.tbl th, .tbl td { border: 2px solid #e6dcc7; padding: 8px 14px; text-align: left; }
.tbl thead th { background: var(--navy); color: #fff; }
.tbl.small { font-size: 15px; }
.tbl.small th, .tbl.small td { padding: 6px 8px; }
.tbl-wrap { overflow-x: auto; }
.lesson-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
.lesson-foot .muted { font-size: 16px; }

/* memory cards */
.fam-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
.fam-tab { min-height: 48px; padding: 6px 14px; border-radius: 12px; border: 3px solid var(--navy); background: var(--white); color: var(--navy); font-weight: 700; cursor: pointer; font-size: 16px; }
.fam-tab.on { background: var(--navy); color: #fff; }
.memcard { background: var(--cream); border: 3px solid var(--gold); border-radius: 18px; padding: 16px; }
.mem-words { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
.mem { min-width: 76px; text-align: center; background: var(--white); border: 3px solid var(--navy); border-radius: 12px; padding: 8px 12px; font-size: 24px; font-weight: 700; color: var(--navy); }
.mem.covered { background: var(--navy); color: var(--gold); }
.mem-steps { display: flex; flex-wrap: wrap; gap: 6px 18px; padding-left: 22px; font-size: 16px; color: var(--muted); }
.mem-steps li.now { color: var(--navy); font-weight: 700; }
.chant { font-size: 16px; background: var(--teal-l); border-radius: 12px; padding: 10px 14px; }
.good-text { color: var(--good); font-weight: 700; }

/* sentence + tokens */
.qbox .prompt { font-size: 21px; font-weight: 700; color: var(--navy); margin: 4px 0 8px; }
.qbox .prompt.big { font-size: clamp(21px, 3.6vw, 25px); }
.sent { position: relative; font-size: clamp(26px, 6vw, 36px); line-height: 2.1; padding: 6px 0 10px; display: flex; flex-wrap: wrap; align-items: flex-start; column-gap: 4px; }
.sent.has-links { padding-top: 40px; }
.w { display: inline-flex; align-items: baseline; position: relative; margin-right: 4px; }
.tok-label { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 3px); font-size: 13px; line-height: 1.1; white-space: nowrap; background: var(--navy); color: #fff; border-radius: 6px; padding: 2px 6px; font-weight: 700; }
.sent:has(.tok-label) { padding-bottom: 30px; }
.punct { color: var(--ink); }
span.tok:not(.sel-adj):not(.sel-adv):not(.noun-found) { padding-left: 1px; padding-right: 1px; border-width: 0; }
.scroll-cue { font-size: 14px; color: var(--muted); margin: 4px 0 0; }
.tok { position: relative; font: inherit; line-height: 1.25; background: transparent; border: 2px solid transparent; border-radius: 10px; padding: 2px 6px 8px; margin: 2px 0; color: var(--ink); text-decoration: none; }
button.tok { cursor: pointer; border-color: #e3dccd; background: var(--white); min-height: 48px; min-width: 44px; }
button.tok:hover { border-color: var(--teal); }
.tok.sel-verb { text-decoration: underline double var(--navy); text-decoration-thickness: 3px; text-underline-offset: 8px; }
.tok.sel-noun { text-decoration: underline solid var(--navy); text-decoration-thickness: 4px; text-underline-offset: 8px; }
.tok.sel-adj { background: var(--gold-l) !important; border-color: var(--gold) !important; }
.tok.sel-adv { background: var(--teal-l) !important; border-color: var(--teal) !important; }
button.tok[aria-pressed="true"] { border-color: var(--navy); }
.tok.m-ok { border-color: var(--good) !important; background: var(--good-l) !important; text-decoration-color: var(--good); }
.tok.m-no { border-color: var(--fix) !important; background: var(--fix-l) !important; text-decoration-color: var(--fix); }
.tok.m-info { border-style: dashed !important; border-color: var(--muted) !important; }
.tok.m-reveal { border-color: var(--gold-d) !important; background: var(--gold-l) !important; }
.tok.shown { border-color: transparent; }
.tok.shown.sel-verb, .tok.shown.sel-noun { color: var(--navy); font-weight: 700; }
.tok.noun-found { outline: 3px dotted var(--navy); outline-offset: 2px; }
.badge { position: absolute; top: -12px; right: -10px; width: 24px; height: 24px; border-radius: 50%; font-size: 14px; line-height: 24px; text-align: center; color: #fff; font-weight: 700; text-decoration: none; display: inline-block; }
.badge.ok { background: var(--good); }
.badge.no { background: var(--fix); }
.badge.rv { background: var(--gold-d); }
.sel-verb.demo, .sel-noun.demo { padding: 0 4px; }
.sel-verb.demo { text-decoration: underline double var(--navy); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.sel-noun.demo { text-decoration: underline solid var(--navy); text-decoration-thickness: 3px; text-underline-offset: 5px; }
.sel-adj.demo { background: var(--gold-l); border: 2px solid var(--gold); border-radius: 6px; padding: 0 4px; }
.sel-adv.demo { background: var(--teal-l); border: 2px solid var(--teal); border-radius: 6px; padding: 0 4px; }
.legend { font-size: 16px; color: var(--muted); margin: 4px 0; }
svg.links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.link-path { fill: none; stroke: var(--teal); stroke-width: 3; }
.arrowhead { fill: var(--teal); }
.links-list { list-style: none; padding: 0; margin: 4px 0 8px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 18px; }

/* choices / sort */
.choices { display: grid; gap: 10px; margin: 10px 0; }
.choice { display: flex; align-items: center; gap: 12px; text-align: left; min-height: 58px; padding: 10px 14px; border-radius: 14px; border: 3px solid #d8cfbd; background: var(--white); cursor: pointer; font-size: 20px; }
.choice:hover { border-color: var(--teal); }
.choice.on { border-color: var(--navy); background: #eef3fb; }
.choice.m-ok { border-color: var(--good); background: var(--good-l); }
.choice.m-no { border-color: var(--fix); background: var(--fix-l); }
.choice:disabled { cursor: default; color: var(--ink); opacity: 1; }
.ch-letter { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--navy); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
.sort { display: grid; gap: 10px; margin: 10px 0; }
.sort-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px; border-radius: 12px; border: 2px solid #efe7d6; }
.sort-row.m-ok { border-color: var(--good); background: var(--good-l); }
.sort-row.m-no { border-color: var(--fix); background: var(--fix-l); }
.sort-word { font-size: 26px; font-weight: 700; min-width: 90px; color: var(--navy); }
.sort-btns { display: flex; flex-wrap: wrap; gap: 8px; }
.bucket { min-height: 48px; padding: 6px 14px; border-radius: 12px; border: 3px solid #d8cfbd; background: var(--white); cursor: pointer; font-size: 16px; font-weight: 700; color: var(--navy); }
.bucket.on { border-color: var(--navy); background: var(--navy); color: #fff; }
.bucket:disabled { cursor: default; }

/* help + feedback */
.coach { background: var(--navy); color: #fff; border-radius: 14px; padding: 12px 14px; font-size: 19px; margin-bottom: 10px; }
.coach-tag { display: inline-block; background: var(--gold); color: var(--navy); border-radius: 999px; padding: 0 10px; font-weight: 700; font-size: 15px; margin-right: 6px; }
.hint { background: var(--gold-l); border: 2px solid var(--gold); border-radius: 12px; padding: 10px 14px; margin: 10px 0; font-size: 18px; }
.fb:empty { display: none; }
.fb { margin: 10px 0; }
.fb:focus { outline: none; }
.msg { border-radius: 12px; padding: 10px 14px; margin: 6px 0; font-size: 18px; }
.msg.good { background: var(--good-l); border-left: 6px solid var(--good); }
.msg.fix { background: var(--fix-l); border-left: 6px solid var(--fix); }
.msg.info { background: var(--info-l); border-left: 6px solid var(--navy); }
.yay { font-size: 24px; font-weight: 700; color: var(--good); animation: pop .4s ease-out; }
@keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.qactions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }

/* reading */
.read-layout { display: grid; grid-template-columns: 1fr; gap: 16px; }
.read-text .passage { background: var(--cream); border: 2px solid #e6dcc7; border-radius: 14px; padding: 14px 16px; max-height: 50vh; overflow-y: auto; font-size: 19px; line-height: 1.7; }
.passage p { margin: 0 0 10px; }
.p-title { margin: 0 0 4px; }
.p-type { font-size: 14px; background: var(--teal-l); border-radius: 999px; padding: 1px 8px; color: var(--teal); vertical-align: middle; }
.sent-btn { font: inherit; line-height: 1.5; text-align: left; background: var(--white); border: 2px solid #d8cfbd; border-radius: 10px; padding: 4px 8px; margin: 3px 0; cursor: pointer; display: inline; }
.sent-btn:hover { border-color: var(--teal); }
.sent-btn.picked { background: var(--gold-l); border-color: var(--navy); border-width: 3px; }
.sent-btn.m-ok { background: var(--good-l); border-color: var(--good); }
.sent-btn.m-no { background: var(--fix-l); border-color: var(--fix); }
.only-wide { display: none; }
@media (min-width: 900px) {
  .read-layout { grid-template-columns: 1.1fr 1fr; align-items: start; }
  .read-text { position: sticky; top: 10px; }
  .read-text .passage { max-height: 78vh; }
  .only-wide { display: inline; } .only-narrow, .scroll-cue { display: none; }
}

/* rounds / results */
.rdot { display: inline-flex; align-items: center; justify-content: center; min-width: 36px; height: 36px; border-radius: 50%; border: 3px solid #d8cfbd; background: var(--white); font-weight: 700; color: var(--navy); font-size: 16px; padding: 0; }
.rdot.now { border-color: var(--navy); background: var(--gold-l); }
.rdot.ind { background: var(--gold); border-color: var(--navy); }
.rdot.help { background: var(--teal-l); border-color: var(--teal); }
.rdot.rev { background: #eee; }
.rdot.answered { background: var(--teal-l); border-color: var(--teal); }
button.rdot { cursor: pointer; min-width: 44px; height: 44px; }
button.rdot.now { border-color: var(--navy); background: var(--gold-l); }
.tally { list-style: none; padding: 0; display: inline-grid; gap: 8px; text-align: left; font-size: 20px; }
.tally .rdot { margin-right: 8px; }
.end-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 12px 0; }
.end-card .end-art { display: flex; justify-content: center; }
.key { font-size: 21px; background: var(--gold-l); border-radius: 12px; padding: 12px; }
.score { font-size: 40px; font-weight: 700; color: var(--navy); margin: 0; }
.review .rq { font-weight: 700; color: var(--navy); }
.rules { font-size: 20px; }
.status { display: inline-block; border-radius: 999px; padding: 1px 10px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.s-none { background: #eee; } .s-practicing { background: var(--teal-l); } .s-review { background: var(--fix-l); color: var(--fix); } .s-strong { background: var(--good-l); color: var(--good); }
.hist { padding-left: 20px; }
.confirm { margin-top: 12px; background: #fdecec; border: 2px solid #9b1c1c; border-radius: 12px; padding: 12px; }
.next-skill { background: var(--teal-l); border-radius: 12px; padding: 10px 14px; }

/* printable sheets */
.sheet { background: #fff; color: #111; max-width: 760px; margin: 14px auto; padding: 28px 32px; border: 2px solid #e6dcc7; border-radius: 12px; font-size: 16px; }
.sheet h1 { font-size: 28px; margin: 0 0 4px; color: var(--navy); }
.sh-sub { margin: 0 0 12px; font-size: 17px; }
.sh-sec { border-top: 2px solid var(--gold); padding-top: 8px; margin-top: 12px; break-inside: avoid; }
.sh-sec h2 { font-size: 19px; }
.sh-note { background: var(--gold-l); padding: 6px 10px; border-radius: 8px; }
.sh-practice li { margin-bottom: 14px; font-size: 19px; }
.sh-key { border-top: 3px dashed #999; margin-top: 30px; color: #333; }
.sh-foot { font-size: 12px; color: #777; text-align: right; }

@media (max-width: 640px) {
  body { font-size: 18px; }
  .hero { flex-direction: column; text-align: center; }
  .hero-art .kid { width: 120px; height: 120px; }
  .compare { grid-template-columns: 1fr; }
  .card { padding: 16px 14px; }
  .brand small { display: none; }
  .brand { font-size: 17px; }
  .brand svg { width: 32px; height: 32px; }
  .top-btn { padding: 4px 10px; }
  .lesson-foot .btn.big { flex: 1; }
  .sheet { padding: 18px 14px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
@media print {
  @page { margin: 14mm; }
  body { background: #fff; font-size: 14px; }
  .top, .notice, .no-print, .subnav { display: none !important; }
  main { padding: 0; max-width: none; }
  .sheet { border: 0; margin: 0; padding: 0; max-width: none; }
  .sh-key { break-before: page; }
}

  { id: 'v7', sk: 'action', s: 'I [think] about my next turn at bat.', ask: 'What do I do?', h: 'Some actions happen inside your head. Find that action.', ex: 'Think is an action that happens in your brain. It is a verb.', notes: { turn: 'Here turn is a thing (my turn). It is a noun in this sentence.', next: 'Next tells which turn. It is not a verb.' } },

  { id: 'v9', sk: 'action', s: 'Jamal [wrote] a letter to his cousin.', ask: 'What did Jamal do?', h: 'Write changes to a new word in the past. Find it.', ex: 'Wrote is the past form of write. It tells what Jamal did.', notes: { letter: 'Letter is the thing Jamal made. Find the action.' } },

  { id: 'v12', sk: 'action', s: 'The coach [clapped] for the team.', ask: 'What did the coach do?', h: 'What did the coach do with his hands?', ex: 'Clapped tells what the coach did.', notes: { team: 'Team is a group of people (a noun).' } },
  { id: 'v13', sk: 'action', s: 'Dad [ate] two slices of pie.', ask: 'What did Dad do?', h: 'Eat changes to a new word in the past. Find it.', ex: 'Ate is the past form of eat. It tells what Dad did.', notes: { slices: 'Slices are things.', two: 'Two tells how many.' } },
  { id: 'v14', sk: 'action', s: 'Our class [planted] seeds in the garden.', ask: 'What did our class do?', h: 'What did the class do with the seeds?', ex: 'Planted tells what the class did.', notes: { garden: 'Garden is a place.', seeds: 'Seeds are things.' } },

  { id: 'v16', sk: 'being', s: 'The ball [was] in the grass.', h: 'Nobody is doing an action. Which word tells about being?', ex: 'Was tells where the ball was being. It is the only verb.', notes: { grass: 'Grass is a thing.', in: 'In tells where.' } },
  { id: 'v17', sk: 'being', s: 'I [am] ready for the game.', h: 'Look for a BE family word.', ex: 'Am is a being verb. Ready describes me.', notes: { ready: 'Ready describes me. It is not a verb.' } },
  { id: 'v18', sk: 'being', s: 'The players [were] hungry after practice.', h: 'Look for a BE family word. Hungry describes the players.', ex: 'Were is the being verb. Hungry describes the players.', notes: { hungry: 'Hungry describes the players. It is not a verb.', practice: 'Here practice is a thing (after practice), so it is a noun in this sentence.' } },
  { id: 'v19', sk: 'being', s: 'My shoes [are] muddy.', h: 'Which word tells about being? Muddy describes the shoes.', ex: 'Are is the being verb. Muddy describes my shoes.', notes: { muddy: 'Muddy describes the shoes. It is not a verb.' } },

  { id: 'v21', sk: 'being', s: 'She [has] a new bat.', h: 'Is there a word that tells what she owns?', ex: 'Has is the main verb. It tells what she owns.', notes: { new: 'New describes the bat.' } },
  { id: 'v22', sk: 'being', s: 'We [had] pizza after the game.', h: 'Look for a HAVE family word.', ex: 'Had is the main verb here. It stands alone.', notes: { pizza: 'Pizza is a thing.', game: 'Game is a thing (an event).' } },

  { id: 'v24', sk: 'being', s: 'The kids [did] their homework.', h: 'Look for a DO family word. Is there another verb after it?', ex: 'Did is the main verb. It tells what the kids did.', notes: { homework: 'Homework is a thing.' } },

  { id: 'v28', sk: 'team', s: 'He [can] [swim].', ask: 'What can he do?', h: 'Can is a helper. What can he do?', ex: 'Can helps swim. The verb team is can swim.' },
  { id: 'v29', sk: 'team', s: 'They [will] [practice].', ask: 'What will they do?', h: 'Will is a helper. What will they do?', ex: 'Will helps practice. The verb team is will practice.' },
  { id: 'v30', sk: 'team', s: 'I [am] [packing] my bag.', ask: 'What am I doing?', h: 'Ask: What am I doing?', ex: 'Am helps packing. The verb team is am packing.', notes: { bag: 'Bag is a thing.' } },
  { id: 'v31', sk: 'team', s: 'The fans [were] [cheering] loudly.', ask: 'What were the fans doing?', h: 'Ask: What were the fans doing? Stop before the word that tells how.', ex: 'Were helps cheering. The verb team is were cheering.', notes: { loudly: 'Loudly tells HOW they cheered. It is an adverb, not a verb.' } },
  { id: 'v32', sk: 'team', s: 'Mia [is] [running] to second base.', ask: 'What is Mia doing?', h: 'Ask: What is Mia doing?', ex: 'Is helps running. The verb team is is running.', notes: { base: 'Base is a place.', second: 'Second tells which base.' } },
  { id: 'v33', sk: 'team', s: 'I [have] [packed] my bag.', ask: 'What have I done?', h: 'Here have helps another verb. Find both words.', ex: 'Have helps packed. The verb team is have packed.', notes: { bag: 'Bag is a thing.' } },
  { id: 'v34', sk: 'team', s: 'Dad [had] [cooked] the turkey before noon.', ask: 'What had Dad done?', h: 'Had is a helper here. What had Dad done?', ex: 'Had helps cooked. The verb team is had cooked.', notes: { turkey: 'Turkey is a thing.', noon: 'Noon tells a time. It is not a verb.' } },
  { id: 'v35', sk: 'team', s: 'You [should] [wear] your helmet.', ask: 'What should you do?', h: 'Should is a helper. What should you do?', ex: 'Should helps wear. The verb team is should wear.', notes: { helmet: 'Helmet is a thing.' } },

      { t: 'mc', q: { q: 'BE family: am, is, are, ___, were', c: ['has', 'was', 'can'], a: 1, h: 'Say the chant: am, is, are, ...', ex: 'am, is, are, WAS, were.' } },

      { t: 'try', q: { mode: 'verb', s: 'She [has] a red bike.', h: 'Is there another verb after has?', ex: 'Has is the only verb. It is the main verb here.', notes: { red: 'Red describes the bike.', bike: 'Bike is a thing.' } } }
    ] },

      { t: 'try', q: { mode: 'verb', s: 'He [can] [swim].', ask: 'What can he do?', h: 'Can is a helper. What can he do?', ex: 'Can helps swim. The verb team is: can swim.' } },

      { t: 'guided', coach: 'This team has THREE verb words. Tap all three.', q: { mode: 'verb', s: 'We [will] [be] [reading].', ask: 'What will we be doing?', h: 'Will and be are helpers. What will we be doing?', ex: 'Will and be help reading. The team is: will be reading.' } },
      { t: 'try', q: { mode: 'verb', s: 'She [had] [been] [waiting] for the bus.', ask: 'What had she been doing?', h: 'Start at had. Keep going until the main verb.', ex: 'Had and been help waiting. The team is: had been waiting.', notes: { bus: 'Bus is a thing.' } } }

<script>
/* Chris's Learning Club — app logic. No network, no accounts, no tracking. */
(function () {
  'use strict';
  var D = document;
  var app = D.getElementById('app');

  /* ───────────── small helpers ───────────── */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function areaById(id) { for (var i = 0; i < AREAS.length; i++) if (AREAS[i].id === id) return AREAS[i]; return null; }

  /* ───────────── sentence parsing (token positions are the answer key) ───────────── */
  var TOK_RE = /^([“"‘(]*)(\[?)([A-Za-z][A-Za-z'’]*)(?:@([A-Za-z]+))?(?::([A-Za-z]+))?(\]?)([.,!?;:”"’)]*)$/;

  }

  /* Build all question banks */

  HELPER_MC.forEach(function (r) { addQ(mkMC(r, 'verbs')); });
  NOUN_BANK.forEach(function (r) { addQ(mkSelect(r, 'nouns', 'noun')); });
  ADJ_BANK.forEach(function (r) { addQ(mkSelect(r, 'adjectives', 'adj')); });

  VOWEL_BANK.forEach(function (r) { addQ(r.k === 'sort' ? mkSort(r, 'vowels') : mkMC(r, 'vowels')); });
  var PBY = {};
  PASSAGES.forEach(function (p) {
    var n = 0; p.sents = []; p.paraOf = [];

  });

  /* Lesson questions are built on demand (ids are stable: L:area:lesson:step) */
  var LQ = {};

      q = mkReading({ sk: l.skill, q: raw.q, c: raw.c, a: raw.a, ok: raw.ok, h: raw.h, ex: raw.ex, why: raw.why }, mini, key);
    } else if (raw.mode) {
      q = mkSelect({ s: raw.s, sk: l.skill, want: raw.want, ask: raw.ask, h: raw.h, ex: raw.ex, notes: raw.notes }, a, raw.mode, key);
    } else {

  }
  function showQ(st, a) { var m = { s: st.s, sk: '', labels: st.labels }; return mkSelect(m, a, st.mode, 'show'); }

  /* ───────────── speech (optional, never required) ───────────── */
  var canSpeak = false;

  }

  /* ───────────── progress storage ───────────── */
  var KEY = 'chrissLearningClub.v1';
  var storageOK = true, storageNote = '', noticeDismissed = false;

  }

  function lessonDone(a, id) { return !!P.lessons[a + ':' + id]; }
  function skillRec(a, sk) { var k = a + '.' + sk; if (!P.skills[k]) P.skills[k] = { hist: [], ind: 0, help: 0, rev: 0, chkRight: 0, chkTotal: 0, lastChk: null }; return P.skills[k]; }
  function record(q, outcome) {
    var s = P.stats[q.id] || (P.stats[q.id] = { n: 0, ind: 0, help: 0, rev: 0, last: 0 });
    s.n++; s[outcome]++;
    if (s.n === 1) s.first = outcome;
    var r = skillRec(q.area, q.sk);

  }
  function skillStatus(a, sk) {
    var r = P.skills[a + '.' + sk];

    if (r.lastChk && r.lastChk.right < r.lastChk.total) return { key: 'review', label: 'Needs review' };
    var recent = r.hist.slice(-8), ind = recent.filter(function (x) { return x === 'ind'; }).length;
    if (recent.length >= 3 && ind / recent.length < 0.5) return { key: 'review', label: 'Needs review' };
    if (ind >= 5 && ind / recent.length >= 0.8) return { key: 'strong', label: 'Getting strong' };

  }
  function nextSkill() {
    var i, a, list, j;
    for (i = 0; i < AREAS.length; i++) { a = AREAS[i].id; list = SKILLS[a]; for (j = 0; j < list.length; j++) if (skillStatus(a, list[j].id).key === 'review') return { a: a, sk: list[j], why: 'needs review' }; }
    for (i = 0; i < AREAS.length; i++) { a = AREAS[i].id; list = SKILLS[a]; for (j = 0; j < list.length; j++) if (!list[j].optional && !lessonDone(a, list[j].lesson)) return { a: a, sk: list[j], why: 'lesson not done yet' }; }

    AREAS.forEach(function (ar) { SKILLS[ar.id].forEach(function (s) { if (s.optional) return; var r = P.skills[ar.id + '.' + s.id]; var n = r ? r.hist.length : 0; if (skillStatus(ar.id, s.id).key !== 'strong' && n < bn) { bn = n; best = { a: ar.id, sk: s, why: 'more practice will help' }; } }); });

  /* ───────────── question pools & rotation ───────────── */

  /* ───────────── question state ───────────── */
  var IGNORE_ADJ = { a: 'article', an: 'article', the: 'article', my: 'whose', your: 'whose', his: 'whose', her: 'whose', its: 'whose', our: 'whose', their: 'whose' };

  /* Grade exactly: by token-index sets, chosen index, or sentence index */

  function autoNote(q, t, phaseNoun) {

  function qWidget(QS, opts) {

      var prompt = QS.phase === 'noun' ? 'Step 1: Tap the NOUN.' : QS.phase === 'adj' ? 'Step 2: Tap the adjective that describes it.' : promptFor(q);
      main += '<p class="prompt">' + esc(prompt) + '</p>';
      var marks = QS.fb && QS.fb.marks && !test ? QS.fb.marks : null;
      main += sentenceHTML(q, { interactive: !QS.done, sel: QS.sel, marks: marks, links: QS.done && !test, nounIdx: QS.phase === 'adj' ? QS.nounIdx : null });
      main += '<p class="legend">' + (QS.phase === 'noun' ? 'Tap the naming word.' : MODE_LEGEND[q.mode]) + ' Tap again to remove it. The line means “my choice,” not “correct.”</p>';
      main += sayBtn(plainSentence(q), 'Read the sentence');

    } else if (q.kind === 'mc') {
      main += '<p class="prompt big">' + nl(q.q) + '</p>' + sayBtn(q.q.replace(/\n/g, ' ') + ' ' + q.c.join('. '), 'Read the question');
      main += '<div class="choices" role="group" aria-label="Answer choices">';
      q.c.forEach(function (c, i) {
        var on = QS.choice === i, mk = QS.fb && QS.fb.marks && !test ? QS.fb.marks[i] : null;
        main += '<button type="button" class="choice' + (on ? ' on' : '') + (mk ? ' m-' + mk : '') + '" data-act="choice" data-i="' + i + '" data-fkey="ch' + i + '" aria-pressed="' + (on ? 'true' : 'false') + '"' + (QS.done ? ' disabled' : '') + '><span class="ch-letter">' + 'ABCD'.charAt(i) + '</span> ' + esc(c) + '</button>';
      });
      main += '</div>';
      if (q.say && canSpeak) main += '<p class="muted small">Tip: tap “Read the question” to hear the words.</p>';
    } else if (q.kind === 'sort') {
      main += '<p class="prompt big">' + esc(q.q) + '</p><div class="sort">';
      q.items.forEach(function (it, i) {
        var mk = QS.fb && QS.fb.marks && !test ? QS.fb.marks[i] : null;
        main += '<div class="sort-row' + (mk ? ' m-' + mk : '') + '"><span class="sort-word">' + esc(it[0]) + (mk === 'ok' ? ' ✓' : mk === 'no' ? ' ✕' : '') + '</span>';
        if (canSpeak) main += '<button type="button" class="say mini" data-act="say" data-text="' + esc(it[0]) + '" aria-label="Hear ' + esc(it[0]) + '">🔊</button>';
        main += '<span class="sort-btns" role="group" aria-label="Group for ' + esc(it[0]) + '">';
        q.b.forEach(function (b, bi) {
          var on = QS.sort[i] === bi;
          main += '<button type="button" class="bucket' + (on ? ' on' : '') + '" data-act="sort" data-i="' + i + '" data-b="' + bi + '" data-fkey="s' + i + '_' + bi + '" aria-pressed="' + (on ? 'true' : 'false') + '"' + (QS.done ? ' disabled' : '') + '>' + esc(b) + '</button>';
        });
        main += '</span></div>';
      });
      main += '</div>';
    } else if (q.kind === 'ev') {
      main += '<p class="prompt big">' + esc(q.q) + '</p><p class="legend">Tap a sentence in the text. ' + (q.passage.title ? 'The text is ' + '<span class="only-wide">on the left</span><span class="only-narrow">above</span>.' : '') + '</p>';
    }

    // hints / feedback / actions
    if (!test) {
      if (QS.hint > 0 && !QS.done) {
        main += '<div class="hint"><b>Hint:</b> ' + esc(hintText(QS, 1)) + (QS.hint > 1 ? '<br><b>Bigger hint:</b> ' + esc(hintText(QS, 2)) : '') + '</div>';
      }

      if (flash && QS.done && !QS.revealed) main += '<div class="yay"><span aria-hidden="true">⭐</span> ' + esc(flash) + '</div>';
      if (QS.fb) QS.fb.msgs.forEach(function (m) { main += '<p class="msg ' + m.t + '">' + esc(m.x) + '</p>'; });
      main += '</div>';
      main += '<div class="qactions">';
      if (!QS.done) {
        main += '<button type="button" class="btn primary" data-act="check" data-fkey="check"' + (answered(QS) ? '' : ' aria-disabled="true"') + '>Check</button>';
        if (QS.hint < 2) main += '<button type="button" class="btn" data-act="hint" data-fkey="hint">' + (QS.hint === 0 ? 'Hint' : 'Bigger hint') + '</button>';
        if (QS.tries > 0 || QS.hint > 0) main += '<button type="button" class="btn ghost" data-act="showme" data-fkey="showme">Show me</button>';

  function promptFor(q) {
    if (q.mode === 'verb') return 'Find the verb. If it is a verb team, tap EVERY verb word.';
    if (q.mode === 'noun') {
      if (!q.want) return 'Tap ALL the nouns.';
      return { p: 'Tap the noun that names a PERSON.', l: 'Tap the noun that names a PLACE.', t: 'Tap the noun that names a THING.', i: 'Tap the noun that names an IDEA.', P: 'Tap every PROPER noun (special names).', c: 'Tap the COMMON noun.' }[q.want];
    }
    if (q.mode === 'adj') return 'Tap every adjective (describing word).';
    if (q.mode === 'adv') return q.want ? 'Tap the adverb that tells ' + q.want.toUpperCase() + '.' : 'Tap the adverb.';
    return '';
  }

  /* Actions on the active question */
  function activeQS() { return view.qs || null; }
  function qAct(act, el) {
    var QS = activeQS(); if (!QS) return;
    var q = QS.q, i = el ? parseInt(el.getAttribute('data-i'), 10) : -1;
    if (act === 'tok' && !QS.done) {
      var k = QS.sel.indexOf(i); if (k >= 0) QS.sel.splice(k, 1); else QS.sel.push(i);
      QS.fb = null;
    } else if (act === 'choice' && !QS.done) { QS.choice = i; QS.fb = null; }
    else if (act === 'sort' && !QS.done) { QS.sort[i] = parseInt(el.getAttribute('data-b'), 10); QS.fb = null; }
    else if (act === 'ev' && !QS.done) { QS.pick = i; QS.fb = null; }
    else if (act === 'hint' && !QS.done) { QS.hint = Math.min(2, QS.hint + 1); }
    else if (act === 'check' && !QS.done) {
      if (QS.ctx === 'test') return;
      var r = evaluate(QS);
      if (r.empty) { QS.fb = r; render(); return; }
      QS.tries++; QS.fb = r;
      if (r.correct) {
        if (QS.phase === 'noun') {
          QS.nounIdx = uniqueTargets(q)[0]; QS.phase = 'adj'; QS.sel = [];
          QS.fb = { msgs: [{ t: 'good', x: 'Yes! “' + q.toks[QS.nounIdx].w + '” is the noun. Now find the word that describes it.' }], marks: {} };
        } else {
          QS.done = true; flash = praise(); questionDone(QS);
        }
      }
    } else if (act === 'showme' && !QS.done) {
      QS.revealed = true; QS.done = true; QS.phase = null; QS.nounIdx = null;
      var marks = {};
      if (q.kind === 'select') { QS.sel = q.ans.slice(); q.ans.forEach(function (j) { marks[j] = 'reveal'; }); }
      if (q.kind === 'mc') { QS.choice = q.a; marks[q.a] = 'ok'; }
      if (q.kind === 'sort') { q.items.forEach(function (it, j) { QS.sort[j] = it[1]; marks[j] = 'ok'; }); }
      if (q.kind === 'ev') { QS.pick = q.ok[0]; marks[q.ok[0]] = 'ok'; }
      QS.fb = { msgs: [{ t: 'info', x: 'Here is the answer. ' + q.ex }], marks: marks };
      questionDone(QS);
    }
    if (view.v === 'test') { view.ans[q.id] = saveAnswer(QS); saveResume(); }
    render();
  }
  function questionDone(QS) {
    if (view.v === 'round') {
      var oc = outcomeOf(QS);
      record(QS.q, oc);
      view.res[view.i] = oc;
      saveResume();
    }
  }

    if (q.kind === 'mc') return g.choice != null ? q.c[g.choice] : 'No answer';
    if (q.kind === 'sort') return q.items.map(function (it, i) { return it[0] + ' → ' + (g.sort && g.sort[i] != null ? q.b[g.sort[i]] : '?'); }).join('; ');
    if (q.kind === 'ev') return g.pick != null ? q.passage.sents[g.pick] : 'No answer';
    return '';

    AREAS.forEach(function (a) {
      var ls = LESSONS[a.id], done = ls.filter(function (l) { return lessonDone(a.id, l.id); }).length;
      h += '<div class="card"><h2>' + esc(a.name) + ' <span class="muted small">· ' + done + ' of ' + ls.length + ' lessons done</span></h2><div class="tbl-wrap"><table class="tbl small"><thead><tr><th scope="col">Skill</th><th scope="col">Lesson</th><th scope="col">First try</th><th scope="col">With help</th><th scope="col">Shown</th><th scope="col">Checks</th><th scope="col">Status</th></tr></thead><tbody>';
      SKILLS[a.id].forEach(function (s) {
        var r = P.skills[a.id + '.' + s.id] || { ind: 0, help: 0, rev: 0, chkRight: 0, chkTotal: 0 }, st = skillStatus(a.id, s.id);
        h += '<tr><th scope="row">' + esc(s.name) + (s.optional ? ' <span class="tag">optional</span>' : '') + '</th><td>' + (lessonDone(a.id, s.lesson) ? '✓' : '–') + '</td><td>' + r.ind + '</td><td>' + r.help + '</td><td>' + r.rev + '</td><td>' + (r.chkTotal ? r.chkRight + '/' + r.chkTotal : '–') + '</td><td><span class="status s-' + st.key + '">' + esc(st.label) + '</span></td></tr>';
      });
      h += '</tbody></table></div></div>';
    });
    h += '<div class="card"><h2>Check My Skills history</h2>';
    if (!P.checks.length) h += '<p class="muted">No checks yet.</p>';
    else h += '<ul class="hist">' + P.checks.slice(-10).reverse().map(function (c) { var a = areaById(c.a); var d = new Date(c.date); return '<li>' + esc(isNaN(d) ? '' : d.toLocaleDateString()) + ' · ' + esc(a ? a.short : c.a) + ': <b>' + c.score + ' of ' + c.n + '</b>' + (c.missed && c.missed.length ? ' · review: ' + esc(c.missed.map(function (s) { var so = skillById(c.a, s); return so ? so.name : s; }).join(', ')) : '') + '</li>'; }).join('') + '</ul>';
    h += '</div><div class="card"><h2>Settings</h2>' + btn('editNameG', 'Change nickname (now: ' + esc(P.nick) + ')');
    if (view.confirmReset) h += '<div class="confirm" role="alertdialog" aria-label="Confirm reset"><p><b>Erase all progress on this device?</b> This cannot be undone.</p>' + btn('doReset', 'Yes, erase everything', null, 'danger') + ' ' + btn('cancelReset', 'Cancel') + '</div>';
    else h += ' ' + btn('askReset', 'Reset all progress', null, 'ghost');
    h += '</div>';
    return h;
  }

  /* ───────────── render ───────────── */
  function screenHTML() {
    switch (view.v) {
      case 'home': return screenHome();
      case 'area': return screenArea();
      case 'learn': return screenLearn();
      case 'lesson': return screenLesson();
      case 'lessonEnd': return screenLessonEnd();
      case 'pick': return screenPick();
      case 'round': return screenRound();
      case 'roundEnd': return screenRoundEnd();
      case 'testSetup': return screenTestSetup();
      case 'test': return screenTest();
      case 'testReview': return screenTestReview();
      case 'testResult': return screenTestResult();
      case 'guides': return screenGuides();
      case 'sheet': return screenSheet();
      case 'grown': return screenGrown();
    }
    return screenHome();
  }
  function renderNotice() {
    var n = D.getElementById('notice');
    if (!n) return;
    if (storageNote && !noticeDismissed) { n.hidden = false; n.innerHTML = '<span>' + esc(storageNote) + '</span> <button type="button" class="btn small" data-act="dismissNotice">OK</button>'; }
    else { n.hidden = true; n.innerHTML = ''; }
  }
  function render(focusTitle) {
    var active = D.activeElement, fkey = active && active.getAttribute ? active.getAttribute('data-fkey') : null;
    app.innerHTML = screenHTML();
    D.body.setAttribute('data-view', view.v);
    renderNotice();
    drawLinks();
    if (focusTitle) {
      window.scrollTo(0, 0);
      var t = D.getElementById('scr-title'); if (t) { try { t.focus({ preventScroll: true }); } catch (e) { t.focus(); } }
    } else if (fkey) {
      var el = app.querySelector('[data-fkey="' + fkey + '"]');
      if (!el || el.disabled) el = app.querySelector('[data-fkey="lnext"]') || app.querySelector('[data-fkey="nextQ"]') || app.querySelector('.fb');
      if (el) { if (!el.hasAttribute('tabindex') && el.classList.contains('fb')) el.setAttribute('tabindex', '-1'); try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
    }
  }
  var rt = null;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(drawLinks, 120); });

  /* ───────────── events ───────────── */
  D.addEventListener('submit', function (e) {
    var f = e.target; if (!f.getAttribute('data-form')) return;
    e.preventDefault();
    var v = (f.querySelector('input').value || '').trim().slice(0, 20);
    P.nick = v || 'Player'; saveP(); view.editName = false; render(true);
  });
  D.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el || el.getAttribute('aria-disabled') === 'true' && el.getAttribute('data-act') !== 'check') return;
    var act = el.getAttribute('data-act');
    var A = function (n) { return el.getAttribute('data-' + n); };
    switch (act) {
      case 'home': return go({ v: 'home' });
      case 'say': return speak(A('text'));
      case 'dismissNotice': noticeDismissed = true; renderNotice(); return;
      case 'editName': view.editName = true; render(); var inp = D.getElementById('nick'); if (inp) inp.focus(); return;
      case 'editNameG': view = { v: 'home', editName: true }; render(true); var inp2 = D.getElementById('nick'); if (inp2) inp2.focus(); return;
      case 'cancelName': view.editName = false; return render(true);
      case 'resume': return doResume();
      case 'area': return go({ v: 'area', a: A('a') || view.a });
      case 'learn': return go({ v: 'learn', a: view.a });
      case 'lesson': return startLesson(view.a, A('l'), 0);
      case 'pick': return go({ v: 'pick', a: view.a, mode: A('mode') });
      case 'startRound': return startRound(view.a, view.mode, A('sk') || null, null);
      case 'startStory': return startRound('reading', view.mode, null, A('p'));
      case 'practiceSkill': return startRound(A('a'), A('mode') || 'practice', A('sk'), null);
      case 'testSetup': return go({ v: 'testSetup', a: view.a });
      case 'startTest': return startTest(view.a, parseInt(A('n'), 10));
      case 'guides': return go({ v: 'guides' });
      case 'grown': return go({ v: 'grown' });
      case 'sheet': return go({ v: 'sheet', k: A('k') });
      case 'print': return window.print();
      case 'pdfDownload': {
        try { var url = getPdfURL(), link = D.createElement('a'); link.href = url; link.download = 'Chris_II_Verb_Memory_Guide.pdf'; D.body.appendChild(link); link.click(); link.remove(); } catch (err) { alert('Sorry, the PDF could not be downloaded in this browser.'); }
        return;
      }
      case 'pdfOpen': { try { window.open(getPdfURL(), '_blank'); } catch (err2) { /* ignore */ } return; }
      case 'askReset': view.confirmReset = true; return render();
      case 'cancelReset': view.confirmReset = false; return render(true);
      case 'doReset': {
        P = defP(); saveP(); view.confirmReset = false; render(true); return;
      }
      // lessons
      case 'lnext': {
        var les = lessonById(view.a, view.l);
        if (view.step >= les.steps.length - 1) { P.lessons[view.a + ':' + view.l] = true; saveP(); return go({ v: 'lessonEnd', a: view.a, l: view.l }); }
        view.step++; setLessonQS(view); saveResume(); return render(true);
      }
      case 'lback': {
        if (view.step === 0) return go({ v: 'learn', a: view.a });
        view.step--; setLessonQS(view); saveResume(); return render(true);
      }
      case 'lrepeat': view.step = 0; view.cards = { f: 0, covered: false, revealed: false }; setLessonQS(view); saveResume(); return render(true);
      case 'fam': view.cards = { f: parseInt(A('i'), 10), covered: false, revealed: false }; return render();
      case 'cover': view.cards.covered = true; view.cards.revealed = false; render(); var rv = app.querySelector('[data-fkey="reveal"]'); if (rv) rv.focus(); return;
      case 'reveal': view.cards.covered = false; view.cards.revealed = true; render(); var cv = app.querySelector('[data-fkey="cover"]'); if (cv) cv.focus(); return;
      // practice rounds
      case 'nextQ': {
        if (view.i >= view.ids.length - 1) return go({ v: 'roundEnd', a: view.a, mode: view.mode, sk: view.sk, story: view.story, ids: view.ids, res: view.res });
        view.i++; view.qs = newQS(QBY[view.ids[view.i]], view.mode); flash = null; saveResume(); return render(true);
      }
      case 'quitRound': P.resume = null; saveP(); return go({ v: 'area', a: view.a });
      case 'again': {
        if (view.story) { var nx = storyOrder()[0]; return startRound('reading', view.mode, null, nx.id); }
        return startRound(view.a, view.mode, view.sk, null);
      }
      // tests
      case 'tnext': case 'tprev': case 'tjump': {
        view.ans[view.qs.q.id] = saveAnswer(view.qs);
        view.i = act === 'tnext' ? view.i + 1 : act === 'tprev' ? view.i - 1 : parseInt(A('i'), 10);
        view.v = 'test'; view.qs = newQS(QBY[view.ids[view.i]], 'test', view.ans[view.ids[view.i]]); saveResume(); return render(true);
      }
      case 'treview': view.ans[view.qs.q.id] = saveAnswer(view.qs); view.v = 'testReview'; saveResume(); return render(true);
      case 'tback': view.v = 'test'; view.qs = newQS(QBY[view.ids[view.i]], 'test', view.ans[view.ids[view.i]]); return render(true);
      case 'submitTest': return submitTest();
      case 'quitTest': P.resume = null; saveP(); return go({ v: 'area', a: view.a });
      // question actions
      case 'tok': case 'choice': case 'sort': case 'ev': case 'hint': case 'check': case 'showme':
        return qAct(act, el);
    }
  });

  /* Test hooks for automated checks (harmless in normal use) */
  window.__CLC = { QBY: QBY, AREA_Q: AREA_Q, gradeOnly: gradeOnly, evaluate: function (q, sel) { return evaluate({ q: q, sel: sel, phase: null }); }, lessonQ: lessonQ, P: function () { return P; }, view: function () { return view; } };

  render(true);
})();

</script>
</body>
</html>
